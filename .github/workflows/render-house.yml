name: Render House v1

on:
  push:
    branches: [main]
    paths:
      - scenes/house_v1.py
      - .github/workflows/render-house.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-house:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -2
      - name: Run Blender script and render
        env:
          OUTPUT_DIR: ${{ runner.temp }}/house_output
        run: |
          mkdir -p "$OUTPUT_DIR"
          blender --background --python scenes/house_v1.py -- --noaudio
          test -s "$OUTPUT_DIR/house_v1.blend"
          test -s "$OUTPUT_DIR/house_v1_preview.png"
          ls -lh "$OUTPUT_DIR"
      - name: Upload model and preview
        uses: actions/upload-artifact@v4
        with:
          name: house-v1-model-preview
          path: ${{ runner.temp }}/house_output/
          retention-days: 7
          if-no-files-found: error
